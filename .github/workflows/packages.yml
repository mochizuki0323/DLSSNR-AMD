# Builds the packages on every push and pull request, and attaches them to a GitHub release when a v*
# tag is pushed. The version in the package names comes from the tags (*/build/version.sh). No
# package contains a model: the installers extract it from the user's own nvngx_dlssnr.dll.
#
# Windows switch: the Windows package is built unless the repository variable WINDOWS_PACKAGE is
# "off" (for a Linux-only release):
#   gh variable set WINDOWS_PACKAGE --body off     # Linux only
#   gh variable set WINDOWS_PACKAGE --body on      # Linux and Windows
# A tag with "-win-" in it (v0.0.4-win-preview) is a Windows-only release: no Linux packages, and the
# release is not marked latest, so the latest release keeps its Linux packages.
name: Packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    if: ${{ !contains(github.ref_name, '-win-') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the tags, for the version

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build mingw-w64 g++-multilib python3

      - name: Cache pinned dependencies
        uses: actions/cache@v4
        with:
          path: |
            toolchain
            artifacts/ref
          key: deps-${{ hashFiles('fetch_deps.sh') }}

      - name: Fetch dependencies
        run: bash fetch_deps.sh

      - name: Build the Vulkan loader
        run: bash linux/build/build_vulkan_loader.sh

      - name: Build packages
        run: |
          NR_ARCH=x86_64 bash linux/build/build_package.sh
          NR_ARCH=i686 bash linux/build/build_package.sh

      - name: Check that no model was packaged
        run: |
          for f in linux/package/*.tar.gz; do
            if tar -tzf "$f" | grep -q 'dlssnr\.bin$'; then echo "model found in $f" >&2; exit 1; fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: linux/package/*.tar.gz
          if-no-files-found: error

  windows:
    if: vars.WINDOWS_PACKAGE != 'off'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the tags, for the version

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build mingw-w64 python3

      # GE-Proton's tarball is cached, its unpacked copy (1.6 GB) is not.
      - name: Cache pinned dependencies
        uses: actions/cache@v4
        with:
          path: |
            toolchain
            !toolchain/GE-Proton11-7-x86_64
            artifacts/ref
          key: deps-windows-${{ hashFiles('fetch_deps.sh') }}

      - name: Fetch dependencies
        run: bash fetch_deps.sh --windows

      - name: Build package   # builds the Vulkan loader and the OptiScaler DLLs too
        run: bash windows/build/build_package.sh

      - name: Check that no model was packaged
        run: |
          python3 - windows/package/*.zip <<'PY'
          import sys, zipfile
          for f in sys.argv[1:]:
              if any(n.endswith('dlssnr.bin') for n in zipfile.ZipFile(f).namelist()):
                  sys.exit(f'model found in {f}')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: windows/package/*.zip
          if-no-files-found: error

  release:
    needs: [linux, windows]
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v') &&
      (needs.linux.result == 'success' || (needs.linux.result == 'skipped' && contains(github.ref_name, '-win-'))) &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=true
          case "$GITHUB_REF_NAME" in *-win-*) latest=false;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --generate-notes --latest="$latest"
